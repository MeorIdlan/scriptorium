# Images are built and pushed to GHCR by .github/workflows/deploy.yml; the droplet only pulls.
name: scriptorium

services:
  scriptorium-server:
    image: ghcr.io/meoridlan/scriptorium-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3001
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/scriptorium?replicaSet=rs0&directConnection=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
      - shared-mongo
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 300M
        reservations:
          cpus: "0.1"
          memory: 128M

  scriptorium-client:
    image: ghcr.io/meoridlan/scriptorium-client:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - scriptorium-server
    networks:
      - default
      - shared-edge
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 24M

networks:
  shared-edge:
    external: true
  shared-mongo:
    external: true
